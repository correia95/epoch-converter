            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It is the number of seconds since 00:00:00 UTC on 1 January 1970, ignoring leap seconds. Because it is a single number in UTC, it represents an instant in time regardless of timezone."

            "name": "What is the year 2038 problem?",
            "acceptedAnswer": {
              "@type": "Answer",
